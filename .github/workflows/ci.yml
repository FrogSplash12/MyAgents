name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authknot
          POSTGRES_PASSWORD: authknot
          POSTGRES_DB: authknot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://authknot:authknot@localhost:5432/authknot_test
          REDIS_URL: redis://localhost:6379/0
          APP_SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret
        run: |
          pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/operator-console/package-lock.json
      - name: Install dependencies
        working-directory: frontend/operator-console
        run: npm ci
      - name: Lint
        working-directory: frontend/operator-console
        run: npm run lint
      - name: Type check
        working-directory: frontend/operator-console
        run: npm run type-check
      - name: Test
        working-directory: frontend/operator-console
        run: npm test -- --passWithNoTests
